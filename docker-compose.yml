services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    # Every setting in the root .env (see .env.example and backend/app/config.py) reaches the backend.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./secrets:/secrets:ro
      - ./frontend/src/mocks:/contract-fixtures:ro
    command: ["sh", "-c", "alembic upgrade head && fastapi dev app/main.py --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
